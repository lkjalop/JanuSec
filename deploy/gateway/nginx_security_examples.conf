## TLS 1.3 + strong ciphers, security headers, and basic rate limits

server {
    listen              443 ssl http2;
    server_name         janusec.local;

    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # IP rate limit (burst tokens)
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://janusec_api_upstream;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
}

