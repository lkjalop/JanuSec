filebeat.inputs:
- type: log
  enabled: true
  paths:
    - C:\\logs\\*.json
  json.keys_under_root: true
  json.add_error_key: true

output.http:
  hosts: ["http://localhost:8080"]
  path: "/api/v1/events"
  headers:
    x-api-key: "devkey123"
    Content-Type: "application/json"
  compression_level: 0
  # If you prefer batch endpoint, set path to /api/v1/endpoints/log_batch and send objects of the form {events:[...]}

processors:
  # Example processors to normalize common endpoint fields into IngestEvent shape
  - rename:
      fields:
        - from: "process.name"
          to: "details.process.name"
          ignore_missing: true
        - from: "process.parent.name"
          to: "details.process.parent_name"
          ignore_missing: true
        - from: "destination.ip"
          to: "dst_ip"
          ignore_missing: true
        - from: "destination.port"
          to: "dst_port"
          ignore_missing: true
  - add_fields:
      target: ""
      fields:
        id: "${data.event.id:}"
