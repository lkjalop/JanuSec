[SERVICE]
    Flush        1
    Daemon       Off
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /zeek/logs/current/*.log
    Tag               zeek.*
    Refresh_Interval  2
    Read_from_Head    true
    Skip_Long_Lines   On
    DB                /tmp/flb_zeek.db
    Parser            json

[FILTER]
    Name   modify
    Match  zeek.*
    Add    _source zeek

[OUTPUT]
    Name        http
    Match       zeek.*
    Host        ${JANUSEC_API_HOST}
    Port        ${JANUSEC_API_PORT}
    URI         ${JANUSEC_API_PATH}
    Format      json_lines
    Header      Content-Type application/x-ndjson
    Header      X-API-Key ${JANUSEC_API_KEY}
    Header      X-Tenant-Id ${JANUSEC_TENANT}
    json_date_key ts
    json_date_format iso8601

# Environment variable defaults (set by container env)
# Default to compatibility alias /api/v1/stream/ingest; can be overridden to /api/v1/ingest/zeek-json
# Split into components for the http output plugin
[ENV]
    JANUSEC_API_HOST app
    JANUSEC_API_PORT 8080
    JANUSEC_API_PATH /api/v1/stream/ingest
