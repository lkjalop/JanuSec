[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name        tail
    Path        C:\\logs\\*.json
    Parser      json
    Tag         app.logs

[FILTER]
    Name   modify
    Match  app.logs
    Add    tenant_id default

[FILTER]
    Name   lua
    Match  app.logs
    script C:\\path\\to\\fluentbit_ingest_event.lua
    call   map_ingest_event

# Option A: send one log per request to /api/v1/events (requires IngestEvent shape)
[OUTPUT]
    Name   http
    Match  app.logs
    Host   localhost
    Port   8080
    URI    /api/v1/events
    Format json
    Header x-api-key devkey123
    Header Content-Type application/json
    tls    Off

# Option B: buffer and send batches to /api/v1/endpoints/log_batch using a Lua packer (optional)
# Requires a Lua filter to wrap records into {events:[...]} structure.
