version: '3.8'
services:
  redis:
    image: redis:7.2
    ports:
      - '6379:6379'
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STREAM_INGEST_NAME=ingest_stream
      - WORKER_BYPASS_HEADER=X-Worker-Secret
      - WORKER_BYPASS_TOKEN=${WORKER_BYPASS_TOKEN:-changeme}
    ports:
      - '8000:8000'
    depends_on:
      - redis
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INGEST_URL=http://api:8000/api/v1/endpoints/log_batch
      - WORKER_METRICS_PORT=9108
      - WORKER_BYPASS_HEADER=X-Worker-Secret
      - WORKER_BYPASS_TOKEN=${WORKER_BYPASS_TOKEN:-changeme}
    depends_on:
      - api
      - redis
