[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
ignore_missing_imports = True
plugins = pydantic.mypy
# Keep imports skipped by default when running broader checks; rely on targeted runs for stricter checks
# If you want mypy to automatically install stubs, run: mypy --install-types

# Gradual typing: start with strictness on core correlation module
[mypy-src.core.correlation.*]
strict = True
