<body>

  <!-- ── Nav bar ──────────────────────────────────────────────────────────── -->

      <span class="br-nav__beta">beta</span>

      <button class="br-nav__btn" onclick="window.location.href='/static/settings.html'" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </nav>

  <!-- ── Tab bar ──────────────────────────────────────────────────────────── -->
  <div class="br-tabs" id="br-tabbar">
    <!-- populated by breach.js updateTabBar() -->
  </div>

  <!-- ── Live feed strip ──────────────────────────────────────────────────── -->
  <div class="br-livefeed">
    <div class="br-livefeed__dot" id="br-livefeed-dot"></div>
    <span id="br-livefeed-status">No live source connected</span>
    <span style="margin-left:auto;display:flex;gap:6px;">
      <button class="br-livefeed__btn" onclick="_liveToast('Wazuh')">Wazuh</button>
      <button class="br-livefeed__btn" onclick="_liveToast('Sentinel')">Sentinel</button>
      <button class="br-livefeed__btn" onclick="_liveToast('Splunk')">Splunk</button>
      <button class="br-livefeed__btn" onclick="_liveToast('Defender')">Defender</button>
    </span>
  </div>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <div class="br-body">
    <div id="br-content">
      <!-- Populated by breach.js -->
      <div style="padding:48px 0;text-align:center;color:var(--text-muted);font-size:13px;">
        Loading…
      </div>
    </div>
  </div>

  <!-- ── Scripts ──────────────────────────────────────────────────────────── -->
  <script>
    // Live feed integration probe — checks /api/v1/integrations/{name}/status
    // and renders the result. Falls back to a "not configured" message if
    // the integration endpoint is absent (rather than the previous "coming
    // soon" stub which gave analysts no actionable signal).
    function _liveToast(src) {
      var el = document.createElement('div');
      el.className = 'br-toast';
      el.textContent = 'Probing ' + src + '…';
      document.body.appendChild(el);
      var name = src.toLowerCase();
      var key = (typeof localStorage !== 'undefined' && localStorage.apiKey) ? localStorage.apiKey : 'devkey123';
      fetch('/api/v1/integrations/' + name + '/status', { headers: { 'x-api-key': key } })
        .then(function (r) { return r.ok ? r.json() : { configured: false, status: 'unreachable' }; })
        .catch(function () { return { configured: false, status: 'not_configured' }; })
        .then(function (j) {
          var cfg = j && j.configured;
          var status = (j && j.status) || 'unknown';
          el.textContent = src + ': ' + (cfg ? ('connected (' + status + ')') : 'not configured — set webhook in Integrations');
          el.style.borderColor = cfg ? 'var(--accent-success, #22c55e)' : 'var(--accent-warning, #f59e0b)';
          setTimeout(function () { el.remove(); }, 4000);
        });
    }
  </script>

  <!-- D3 for swimlane + graph (loaded before breach.js) -->
  <script src="/static/js/vendors/d3.min.js" onerror="console.warn('D3 not found — swimlane disabled')"></script>

  <!-- Threat case card rendering module (load BEFORE breach.js) -->

  <script src="/static/js/breach_api.js"></script>

  <script src="/static/js/breach_progress.js"></script>

  <!-- Core breach JS -->
  <script src="/static/js/breach.js"></script>

  <!-- Swimlane + cluster tab + hopgraph (A4, A5, A6) — loaded when available -->
  <script src="/static/js/breach_swimlane.js" onerror=""></script>
  <script src="/static/js/breach_cluster_tab.js" onerror=""></script>
  <script src="/static/js/breach_postmortem_tab.js" onerror=""></script>
  <script src="/static/js/breach_postmortem.js" onerror=""></script>
  <script src="/static/js/breach_hopgraph.js" onerror="console.warn('breach_hopgraph.js not found')"></script>

</body>
