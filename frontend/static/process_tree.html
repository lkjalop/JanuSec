<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Process Tree</title>
  <style>
    :root { --bg:#0B0E14; --panel:#141A24; --muted:#93A0B1; --text:#E8EBF0; --border:#2C3746; --accent:#4A63E7; }
    html,body{background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;margin:0}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .row{display:flex;gap:10px;align-items:center}
    input{background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;min-width:300px}
    button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer}
    pre{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;white-space:pre-wrap}
    .tree{margin-top:16px}
    .node{margin-left:14px;position:relative}
    .node:before{content:'';position:absolute;left:-10px;top:0;width:8px;height:1px;background:var(--border)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <input id="eventId" placeholder="Enter Event ID" />
      <button id="btn">Load</button>
    </div>
    <div id="out" class="tree" aria-live="polite" style="margin-top:12px"></div>
  </div>
  <script>
    function authHeaders(){ try{ const key = localStorage.getItem('apiKey') || 'devkey123'; return {'x-api-key': key}; }catch(_){ return {}; } }
    function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.textContent; }
    function renderTree(list){ if(!Array.isArray(list)) return '<div class=muted>No lineage found</div>'; const lines=[]; const rec=(n,depth)=>{ const pad=''.padStart(depth*2,' '); lines.push(`<div class='node'>${pad}${esc(n.name||n.proc||n.process||n.pid||'proc')}</div>`); (n.children||[]).forEach(c=>rec(c,depth+1)); }; list.forEach(n=>rec(n,0)); return lines.join(''); }
    async function load(){
      const id = document.getElementById('eventId').value.trim();
      const out = document.getElementById('out');
      if(!id){ out.textContent='Enter an Event ID'; return; }
      out.textContent='Loading…';
      try{
        const r = await (window.safeFetch || fetch)(`/api/v1/decisions/${encodeURIComponent(id)}/explain`, { headers: authHeaders() });
        if(!r.ok){ out.textContent='Not found or unauthorized'; return; }
        const j = await r.json();
        // prefer explicit process lineage keys if present
        const lineage = j.process_tree || j.lineage || j.process_lineage || [];
        if (Array.isArray(lineage) && lineage.length){ out.innerHTML = renderTree(lineage); return; }
        out.innerHTML = '<pre>'+esc(JSON.stringify(j,null,2))+'</pre>';
      }catch(e){ out.textContent = 'Error: '+(e && e.message || e); }
    }
    document.getElementById('btn').addEventListener('click', load);
    document.getElementById('eventId').addEventListener('keydown', (e)=>{ if(e.key==='Enter') load(); });
  </script>
  <script src="/static/js/notifications.js"></script>
</body>
</html>
