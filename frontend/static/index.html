<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanuSec Artifact Intelligence Platform</title>
    <style>
        :root {
            --bg-base: #0B0E14;
            --bg-surface: #151922;
            --bg-surface-2: #1C2230;
            --bg-surface-3: #232834;
            --accent-primary: #4A63E7;
            --accent-primary-hover: #5B72F0;
            --accent-primary-light: rgba(74, 99, 231, 0.1);
            --text-primary: #E8EBF0;
            --text-secondary: #A8B2C3;
            --text-muted: #6B7789;
            --border-default: #2A3142;
            --border-light: rgba(255, 255, 255, 0.06);

            /* Risk Severity Colors */
            --risk-critical: #E54D4D;
            --risk-high: #E67E22;
            --risk-medium: #F39C12;
            --risk-low: #3498DB;
            --risk-minimal: #52C41A;

            /* Status Indicators */
            --status-active: #52C41A;
            --status-warning: #FAAD14;
            --status-error: #F5222D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            display: grid;
            grid-template-columns: 64px 1fr 360px;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Bar */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 24px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 24px;
            border-right: 1px solid var(--border-default);
        }

        .logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-stats {
            display: flex;
            gap: 32px;
            margin-left: auto;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(82, 196, 26, 0.1);
            border: 1px solid rgba(82, 196, 26, 0.3);
            border-radius: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--status-active);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Sidebar Navigation */
        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--border-default);
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            margin: 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            color: var(--text-muted);
        }

        .nav-icon:hover {
            background: var(--bg-surface-2);
            color: var(--text-primary);
        }

        .nav-icon.active {
            background: var(--accent-primary-light);
            color: var(--accent-primary);
        }

        /* Main Content Area */
        .main-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-default);
            background: var(--bg-surface-2);
            color: var(--text-primary);
        }

        .btn:hover {
            background: var(--bg-surface-3);
        }

        .btn-primary {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-primary-hover);
        }

        /* Data Grid */
        .data-section {
            flex: 1;
            overflow: auto;
            background: var(--bg-base);
            padding: 20px;
        }

        .data-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .data-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-primary);
        }

        .data-content {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-default);
            border-radius: 4px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: var(--text-secondary);
        }

        /* Right Panel */
        .details-panel {
            background: var(--bg-surface);
            border-left: 1px solid var(--border-default);
            padding: 20px;
            overflow-y: auto;
        }

        .panel-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            padding: 12px;
            background: var(--bg-surface-2);
            border-radius: 8px;
            border: 1px solid var(--border-default);
        }

        .metric-value {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent-primary);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chain-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-surface-2);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .chain-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-container">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
                        <circle cx="32" cy="32" r="30" stroke="var(--accent-primary)" stroke-width="2"/>
                        <path d="M32 8 L32 56" stroke="var(--accent-primary)" stroke-width="1" opacity="0.3"/>
                        <path d="M20 24 Q20 20 24 20 L28 20 L28 44 Q28 48 24 48 L20 48 Z" fill="var(--accent-primary)" opacity="0.8"/>
                        <path d="M44 24 Q44 20 40 20 L36 20 L36 44 Q36 48 40 48 L44 48 Z" fill="var(--accent-primary)" opacity="0.8"/>
                        <circle cx="24" cy="28" r="2" fill="var(--bg-surface)"/>
                        <circle cx="40" cy="28" r="2" fill="var(--bg-surface)"/>
                    </svg>
                </div>
                <div class="logo-text">JanuSec</div>
            </div>

            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-label">Live Data</span>
                    <span class="stat-value" id="stat-live">Connected</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Backend</span>
                    <span class="stat-value">Active</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span style="font-size: 12px; font-weight: 500;">Processing</span>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <div class="nav-icon active" title="Live Dashboard">📊</div>
            <div class="nav-icon" title="Decisions">🔍</div>
            <div class="nav-icon" title="Alerts">⚠️</div>
            <div class="nav-icon" title="Chain">🔗</div>
            <div class="nav-icon" title="Metrics" onclick="window.open('/metrics', '_blank')">📈</div>
            <div class="nav-icon" title="Grafana" onclick="window.open('http://localhost:3000', '_blank')" style="margin-top: auto;">📉</div>
        </nav>

        <main class="main-content">
            <div class="toolbar">
                <button class="btn" onclick="refresh()">🔄 Refresh Data</button>
                <button class="btn" onclick="window.open('/api/v1/decisions/recent', '_blank')">📋 Raw API</button>
                <button class="btn" onclick="window.open('/docs', '_blank')">📚 API Docs</button>
                <button class="btn btn-primary" onclick="window.open('/metrics', '_blank')">📊 Prometheus</button>
            </div>

            <div class="data-section">
                <div class="data-box">
                    <div class="data-header">📝 Recent Decisions (Live API)</div>
                    <div class="data-content" id="decisions">Loading decision data...</div>
                </div>

                <div class="data-box">
                    <div class="data-header">🚨 Recent Alerts (Live API)</div>
                    <div class="data-content" id="alerts">Loading alert data...</div>
                </div>
            </div>
        </main>

        <aside class="details-panel">
            <h3 class="panel-header">
                🔗 Chain Analysis
            </h3>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="chain-status">Ready</div>
                    <div class="metric-label">Chain Status</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="api-status">Connected</div>
                    <div class="metric-label">API Status</div>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Chain ID
                </div>
                <input type="text" id="chainId" class="chain-input" placeholder="Enter chain ID...">
                <button class="btn btn-primary" onclick="loadChain()" style="width: 100%;">Load Chain</button>
            </div>

            <div style="margin-bottom: 20px;">
                <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);">
                    Chain Data
                </div>
                <div class="data-content" id="chainBox">Enter a chain ID above to load chain data...</div>
            </div>

            <div style="margin-top: 16px;">
                <button class="btn" onclick="window.open('/api/v1/chain/', '_blank')" style="width: 100%; justify-content: center;">
                    📋 Browse Chains
                </button>
                <button class="btn" onclick="window.open('http://localhost:3000', '_blank')" style="width: 100%; justify-content: center; margin-top: 8px;">
                    📊 Open Grafana
                </button>
            </div>
        </aside>
    </div>

    <script>
        async function refresh(){
            try {
                const d = await (window.safeFetch || fetch)('/api/v1/decisions/recent').then(r=>r.json());
                document.getElementById('decisions').textContent = JSON.stringify(d.decisions, null, 2);
                document.getElementById('api-status').textContent = 'Connected';
                document.getElementById('api-status').style.color = 'var(--status-active)';
            } catch(e){
                console.error(e);
                document.getElementById('decisions').textContent = 'Error loading decisions: ' + e.message;
                document.getElementById('api-status').textContent = 'Error';
                document.getElementById('api-status').style.color = 'var(--status-error)';
            }
            try {
                const a = await (window.safeFetch || fetch)('/api/v1/alerts/recent').then(r=>r.json());
                document.getElementById('alerts').textContent = JSON.stringify(a.alerts, null, 2);
            } catch(e){
                console.error(e);
                document.getElementById('alerts').textContent = 'Error loading alerts: ' + e.message;
            }
        }

        async function loadChain(){
            const id = document.getElementById('chainId').value;
            if(!id) {
                document.getElementById('chainBox').textContent = 'Please enter a chain ID';
                return;
            }
            try {
                document.getElementById('chainBox').textContent = 'Loading chain data...';
                const c = await (window.safeFetch || fetch)('/api/v1/chain/'+id).then(r=>r.json());
                document.getElementById('chainBox').textContent = JSON.stringify(c.chain, null, 2);
                document.getElementById('chain-status').textContent = 'Loaded';
                document.getElementById('chain-status').style.color = 'var(--status-active)';
            } catch(e){
                console.error(e);
                document.getElementById('chainBox').textContent = 'Error loading chain: ' + e.message;
                document.getElementById('chain-status').textContent = 'Error';
                document.getElementById('chain-status').style.color = 'var(--status-error)';
            }
        }

        // Auto-refresh every 10 seconds
        refresh();
        setInterval(refresh, 10000);

        // Update timestamp
        setInterval(() => {
            document.getElementById('stat-live').textContent = new Date().toLocaleTimeString();
        }, 1000);
    </script>
  <script src="/static/js/notifications.js"></script>
</body>
</html>
