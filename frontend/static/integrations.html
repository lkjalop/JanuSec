<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Integrations</title>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <link rel="stylesheet" href="/static/css/responsive.css"/>
  <style>
    .actions-row { display:flex; flex-wrap:wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
    .btn { background: var(--color-bg-tertiary); border:1px solid var(--color-border); color: var(--color-text-secondary); padding:6px 12px; font-size: var(--font-size-sm); border-radius: var(--radius-sm); cursor:pointer; }
    .btn:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    label { font-size: var(--font-size-xs); color: var(--color-text-muted); margin:4px 0; display:block; }
    pre { font-size: var(--font-size-xs); line-height:1.4; }
  </style>
</head>
<body class="with-topbar">
  <a href="#contentWrapper" class="skip-link">Skip to content</a>
  <div class="page-root">
    <div class="actions-row">
      <a class="btn" href="/static/janusec-platform-complete-LIVE.html">← Console</a>
      <a class="btn" href="/static/hunt_network.html">Network</a>
      <a class="btn" href="/static/hunt_endpoint.html">Endpoint</a>
      <a class="btn" href="/static/metrics.html">Metrics</a>
      <a class="btn" href="/static/sbom.html">SBOM</a>
    </div>
    <h2 class="mt-0" style="margin:12px 0 8px">Integrations Settings</h2>
    <div class="panel" id="webhooksPanel">
      <div class="panel-header"><h3 class="mt-0">Chat / Webhooks</h3></div>
      <div class="panel-body">
        <div class="row" style="flex-direction:column; gap: var(--space-3)">
          <div>
            <label for="slack">Slack Webhook URL</label>
            <input class="input" id="slack" placeholder="https://hooks.slack.com/..."/>
            <button class="btn" id="saveSlack">Save & Test</button>
          </div>
          <div>
            <label for="teams">Teams Webhook URL</label>
            <input class="input" id="teams" placeholder="https://..."/>
            <button class="btn" id="saveTeams">Save & Test</button>
          </div>
          <div>
            <label for="whatsapp">WhatsApp Webhook URL</label>
            <input class="input" id="whatsapp" placeholder="https://..."/>
            <button class="btn" id="saveWhatsApp">Save & Test</button>
          </div>
          <div>
            <label for="jira">Jira Webhook URL</label>
            <input class="input" id="jira" placeholder="https://jira.example/rest/..."/>
            <button class="btn" id="saveJira">Save</button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel" id="mispPanel">
      <div class="panel-header"><h3 class="mt-0">Threat Intel (MISP)</h3></div>
      <div class="panel-body">
        <div class="row">
          <input class="input" id="mispUrl" placeholder="MISP URL (https://...)" style="flex:1" />
          <input class="input" id="mispKey" placeholder="MISP Key" style="flex:1" />
          <button class="btn" id="mispSave">Save</button>
          <button class="btn" id="mispSync">Sync Now</button>
        </div>
      </div>
    </div>
    <div class="panel" id="octiPanel">
      <div class="panel-header"><h3 class="mt-0">Threat Intel (OpenCTI)</h3></div>
      <div class="panel-body">
        <div class="row">
          <input class="input" id="octiUrl" placeholder="OpenCTI URL (https://...)" style="flex:1" />
          <input class="input" id="octiToken" placeholder="OpenCTI Token" style="flex:1" />
          <button class="btn" id="octiSave">Save</button>
          <button class="btn" id="octiSync">Sync Now</button>
        </div>
      </div>
    </div>
    <div class="panel" id="statusPanel">
      <div class="panel-header"><h3 class="mt-0">Status</h3></div>
      <div class="panel-body">
        <pre id="status"></pre>
      </div>
    </div>
  </div>
  <script>
    function authHeaders(){ try{ const k=localStorage.getItem('apiKey')||'devkey123'; return {'x-api-key':k,'Content-Type':'application/json'}; }catch(_){ return {'x-api-key':'devkey123','Content-Type':'application/json'}; } }
    function toast(msg,d=3500){ try{ if(window.showToast) showToast(msg,d); else if(window.notifications) window.notifications.showToast(msg,d); else console.log('toast:',msg); }catch(e){ console.log('toast err',e); } }
    async function save(name,val){
      try{
        const r = await safeFetch(`/api/v1/integrations/${name}/config`, { method:'POST', headers:authHeaders(), body: JSON.stringify({ webhook_url: val }) });
        let j={}; try{ j= await r.json(); }catch(_){ }
        if(!r.ok){ toast(`Save failed: ${j.detail||j.error||r.status}`,4000); return; }
        const t = await safeFetch('/api/v1/webhooks/test', { method:'POST', headers:authHeaders(), body: JSON.stringify({ service:name }) }).catch(()=>null);
        let tj={}; try{ tj = t? await t.json():{}; }catch(_){ }
        toast(`${name} test: ${(tj && tj.delivered)?'delivered':'not configured'}`,3000);
        await refresh();
      }catch(e){ toast('Save failed: '+(e.message||e),4000); }
    }
    async function mispSave(){ try{ const url=v('mispUrl'), key=v('mispKey'); const r= await safeFetch('/api/v1/integrations/misp/config',{method:'POST',headers:authHeaders(),body:JSON.stringify({url,key})}); const j=await r.json(); if(!r.ok){ toast('MISP save failed: '+(j.detail||j.status||j.error),4000); return;} toast('MISP saved',2500); await refresh(); }catch(e){ toast('MISP save failed: '+(e.message||e),4000); } }
    async function mispSync(){ try{ const r= await safeFetch('/api/v1/integrations/misp/sync',{method:'POST',headers:authHeaders()}); const j=await r.json(); if(!r.ok){ toast('MISP sync failed: '+(j.detail||j.status||j.error),4000); return;} toast('MISP sync: '+JSON.stringify(j),3500); await refresh(); }catch(e){ toast('MISP sync failed: '+(e.message||e),4000); } }
    async function octiSave(){ try{ const url=v('octiUrl'), token=v('octiToken'); const r= await safeFetch('/api/v1/integrations/opencti/config',{method:'POST',headers:authHeaders(),body:JSON.stringify({url,token})}); const j=await r.json(); if(!r.ok){ toast('OpenCTI save failed: '+(j.detail||j.status||j.error),4000); return;} toast('OpenCTI saved',2500); await refresh(); }catch(e){ toast('OpenCTI save failed: '+(e.message||e),4000); } }
    async function octiSync(){ try{ const r= await safeFetch('/api/v1/integrations/opencti/sync',{method:'POST',headers:authHeaders()}); const j=await r.json(); if(!r.ok){ toast('OpenCTI sync failed: '+(j.detail||j.status||j.error),4000); return;} toast('OpenCTI sync: '+JSON.stringify(j),3500); await refresh(); }catch(e){ toast('OpenCTI sync failed: '+(e.message||e),4000); } }
    function v(id){ return document.getElementById(id).value; }
    async function refresh(){ try{ const r= await safeFetch('/api/v1/dashboard/integrations/status',{headers:authHeaders()}); const j= r.ok? await r.json():{}; document.getElementById('status').textContent = JSON.stringify(j,null,2); }catch(e){ document.getElementById('status').textContent='Status fetch failed: '+(e.message||e); } }
    document.addEventListener('DOMContentLoaded',()=>{
      try{
        g('saveSlack').onclick = ()=> save('slack', v('slack'));
        g('saveTeams').onclick = ()=> save('teams', v('teams'));
        g('saveWhatsApp').onclick = ()=> save('whatsapp', v('whatsapp'));
        g('saveJira').onclick = ()=> save('jira', v('jira'));
        g('mispSave').onclick = mispSave; g('mispSync').onclick = mispSync;
        g('octiSave').onclick = octiSave; g('octiSync').onclick = octiSync;
        refresh();
      }catch(e){ console.warn('integrations wiring failed',e); }
    });
    function g(id){ return document.getElementById(id); }
  </script>
  <script src="/static/js/notifications.js"></script>
</body>
</html>
