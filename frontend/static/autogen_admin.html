<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto-Incident Admin</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Arial; background:#0B0E14; color:#E8EBF0; margin:0; padding:24px }
    .card { background:#141A24; padding:16px; border-radius:8px; border:1px solid #2C3746; max-width:900px }
    label { display:block; margin-top:12px; color:#C2CBD6 }
    input, textarea, select { width:100%; padding:8px; margin-top:6px; background:#0F1720; color:#E8EBF0; border:1px solid #2C3746; border-radius:6px }
    button { margin-top:12px; padding:8px 12px; background:#4A63E7; border:none; color:#fff; border-radius:6px }
    pre { background:#0F1720; padding:12px; border-radius:6px; overflow:auto }
  </style>
</head>
<body>
  <h2>Auto-Incident Admin</h2>
  <div class="card">
    <label>Enable Auto-Gen</label>
    <select id="enabled"><option value="0">Disabled</option><option value="1">Enabled</option></select>
    <label>Score Threshold</label>
    <input id="threshold" type="number" step="0.01" min="0" max="1" />
    <label>Tenant Rate Max</label>
    <input id="tenant_max" type="number" min="0" />
    <label>Dedup TTL Seconds</label>
    <input id="dedup_ttl" type="number" min="0" />
    <label>SCORING_WEIGHTS_JSON</label>
    <textarea id="weights" rows="6" placeholder='{"diversity":0.07,"mapping":0.0}'></textarea>
    <button id="save">Save Settings</button>
    <h3>Scoring Weights (versioned)</h3>
    <div style="margin-bottom:8px">
      <button id="load_weights">Load Current Weights</button>
      <button id="save_weights">Save Weights</button>
    </div>
    <label>Preview Path (JSON array of nodes)</label>
    <textarea id="preview_path" rows="6" placeholder='[{"user":"alice"},{"domain":"example.com"}]'></textarea>
    <button id="preview">Preview Score</button>
    <h3>Ops</h3>
    <button id="dump">Trigger Scan Now</button>
    <pre id="out">Status output...</pre>
  </div>
<script>
async function api(path, opts){
  const headers = {'x-api-key': localStorage.getItem('apiKey')||'devkey123','Content-Type':'application/json'}
  const r = await fetch(path, Object.assign({headers}, opts||{}))
  return r.json().catch(()=>({status:'ok'}))
}
async function load(){
  try{
    const res = await api('/api/v1/admin/autogen/status',{method:'GET'})
    document.getElementById('enabled').value = res.enabled? '1':'0'
    document.getElementById('threshold').value = res.threshold||0.8
    document.getElementById('tenant_max').value = res.tenant_rate_max||10
    document.getElementById('dedup_ttl').value = res.dedup_ttl||3600
    document.getElementById('weights').value = JSON.stringify(res.weights||{})
    document.getElementById('out').textContent = JSON.stringify(res,null,2)
  }catch(e){ document.getElementById('out').textContent = String(e) }
}
document.getElementById('save').addEventListener('click', async ()=>{
  const body = {
    enabled: document.getElementById('enabled').value==='1',
    threshold: parseFloat(document.getElementById('threshold').value),
    tenant_rate_max: parseInt(document.getElementById('tenant_max').value,10),
    dedup_ttl: parseInt(document.getElementById('dedup_ttl').value,10),
    weights: JSON.parse(document.getElementById('weights').value||'{}'),
  }
  const r = await api('/api/v1/admin/autogen/update',{method:'POST', body: JSON.stringify(body)})
  document.getElementById('out').textContent = JSON.stringify(r,null,2)
})
document.getElementById('dump').addEventListener('click', async ()=>{
  const r = await api('/api/v1/admin/autogen/trigger',{method:'POST'})
  document.getElementById('out').textContent = JSON.stringify(r,null,2)
})
document.getElementById('load_weights').addEventListener('click', async ()=>{
  const r = await api('/api/v1/admin/scoring/get',{method:'GET'})
  if(r && r.weights){
    document.getElementById('weights').value = JSON.stringify(r.weights,null,2)
    document.getElementById('out').textContent = JSON.stringify(r,null,2)
  } else {
    document.getElementById('out').textContent = JSON.stringify(r,null,2)
  }
})
document.getElementById('save_weights').addEventListener('click', async ()=>{
  const w = JSON.parse(document.getElementById('weights').value||'{}')
  const r = await api('/api/v1/admin/scoring/update',{method:'POST', body: JSON.stringify({weights: w})})
  document.getElementById('out').textContent = JSON.stringify(r,null,2)
})
document.getElementById('preview').addEventListener('click', async ()=>{
  let p = document.getElementById('preview_path').value||'[]'
  try{ p = JSON.parse(p) }catch(e){ document.getElementById('out').textContent = 'invalid JSON'; return }
  const w = JSON.parse(document.getElementById('weights').value||'{}')
  const r = await api('/api/v1/graph/session/preview_score',{method:'POST', body: JSON.stringify({path:p, weights: w})})
  document.getElementById('out').textContent = JSON.stringify(r,null,2)
})
load()
</script>
</body>
</html>
