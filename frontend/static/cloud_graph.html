<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud HopGraph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#0e1117; color:#e6e6e6; margin:0; padding:1rem; }
    input, button { padding:0.5rem; margin-right:0.5rem; }
    #viz { width:100%; height:600px; background:#161b22; border:1px solid #2a3142; border-radius:6px; margin-top:12px; position:relative; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:12px }
    th, td { border:1px solid #2a3142; padding:6px; text-align:left }
  </style>
</head>
<body>
  <h2>Cloud Resource Attack Paths</h2>
  <div>
    <input id="entry" placeholder="internet:* or iam:role/app" size="30" />
    <input id="target" placeholder="cloud_resource:s3://sensitive-bucket" size="40" />
    <button onclick="findPaths()">Find Paths</button>
    <a href="/" style="margin-left:10px;color:#58a6ff">Back</a>
  </div>
  <div id="viz"></div>
  <div id="paths"></div>
  <script>
    function authHeaders(){ try { const k = localStorage.getItem('apiKey') || 'devkey123'; return {'x-api-key': k}; } catch(_){ return {}; } }
    async function findPaths(){
      const e = document.getElementById('entry').value.trim();
      const t = document.getElementById('target').value.trim();
      if(!e || !t) return;
      const r = await (window.safeFetch || fetch)(`/api/v1/graph/cloud/paths?entry=${encodeURIComponent(e)}&target=${encodeURIComponent(t)}`, { headers: authHeaders() });
      const j = await r.json();
      render(j);
    }
    function render(data){
      const viz = document.getElementById('viz'); viz.innerHTML='';
      const paths = (data.paths||[]);
      if(!paths.length){ viz.textContent = 'No paths found'; document.getElementById('paths').innerHTML=''; return; }
      // draw first path quickly
      const nodes = new Map(); const links = [];
      const first = paths[0].path;
      for(let i=0;i<first.length-1;i++){ const a=first[i], b=first[i+1]; if(!nodes.has(a)) nodes.set(a,{id:a}); if(!nodes.has(b)) nodes.set(b,{id:b}); links.push({source:a,target:b}); }
      const svg = d3.select('#viz').append('svg').attr('width','100%').attr('height','100%'); const g = svg.append('g'); svg.call(d3.zoom().on('zoom', e=>g.attr('transform', e.transform)));
      const nodeArr=[...nodes.values()];
      const sim = d3.forceSimulation(nodeArr).force('link', d3.forceLink(links).id(d=>d.id).distance(150)).force('charge', d3.forceManyBody().strength(-400)).force('center', d3.forceCenter(viz.clientWidth/2, viz.clientHeight/2));
      const link = g.selectAll('line').data(links).enter().append('line').attr('stroke','#4a5568').attr('stroke-width',2).attr('stroke-opacity',.6);
      const node = g.selectAll('g').data(nodeArr).enter().append('g').call(d3.drag().on('start', s).on('drag', d).on('end', e));
      node.append('circle').attr('r',10).attr('fill', d=> d.id.startsWith('cloud_resource:') ? '#f39c12' : (d.id.startsWith('iam:')?'#9b59b6':'#3498db'));
      node.append('text').attr('dy',-15).attr('text-anchor','middle').style('font-size','11px').text(d=> d.id.length>40? d.id.slice(0,37)+'…':d.id);
      sim.on('tick', ()=>{ link.attr('x1', p=>p.source.x).attr('y1', p=>p.source.y).attr('x2', p=>p.target.x).attr('y2', p=>p.target.y); node.attr('transform', p=>`translate(${p.x},${p.y})`)});
      function s(e,d){ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; } function d(e,d){ d.fx=e.x; d.fy=e.y; } function e(e,d){ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }
      // list all returned paths with explainability tags
      const tbl = [`<table><thead><tr><th>Risk</th><th>Path</th><th>MITRE</th><th>STRIDE</th><th>PASTA</th></tr></thead><tbody>`].concat(paths.map(p=>`
        <tr><td>${p.risk.toFixed(2)}</td><td>${p.path.join(' → ')}</td><td>${(p.mitre||[]).join(',')}</td><td>${(p.stride||[]).join(',')}</td><td>${p.pasta||''}</td></tr>`)).concat(['</tbody></table>']).join('');
      document.getElementById('paths').innerHTML = tbl;
    }
  </script>
</body>
</html>
