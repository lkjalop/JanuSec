name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: janusec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d janusec" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio respx httpx

      - name: Run tests (unit + fast)
        env:
          TEST_HELPERS_ENABLED: '1'
          PLATFORM_LITE_INIT: '1'
          INTROSPECT_ONLY: '0'
          RESIGN_JOBS_REDIS_URL: 'redis://localhost:6379'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/janusec'
        run: |
          # Run non-integration tests first to catch quick failures
          python -m pytest -q tests -k "not integrations and not slow" --maxfail=1 -q

      - name: Run integration tests (redis-enabled)
        env:
          TEST_HELPERS_ENABLED: '1'
          PLATFORM_LITE_INIT: '1'
          RESIGN_JOBS_REDIS_URL: 'redis://localhost:6379'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/janusec'
        run: |
          # Run integration tests that require network mocks or services
          python -m pytest -q tests/integrations -q --maxfail=1 || true
name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        run: |
          cd frontend
          npm init -y
          npm install eslint eslint-plugin-import --no-audit --no-fund
      - name: Lint frontend (touched files only)
        working-directory: frontend
        run: |
          npm ci
          npx eslint static/js/live_console_extra.js static/js/factors.js static/js/hunt_overview.js static/js/investigation.js static/js/metrics.js || true

  tests-python:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v4
      - name: Start test services (Redis + Postgres)
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker-compose -f docker-compose.ci.yml up -d
            # wait for services to be healthy
            for i in {1..30}; do
              docker ps --filter "health=unhealthy" --format '{{.Names}}' | grep -q . && sleep 2 || break
              sleep 1
            done
          else
            echo "No docker-compose.ci.yml found, skipping service startup"
          fi
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run critical tests
        run: |
          python -m pytest -q tests/test_detectors_more.py tests/test_graph_sessions_strict.py -q

  build-test-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff bandit mypy cyclonedx-bom==3.14.2 gitleaks-bin==8.18.4 || true
      - name: Lint (ruff)
        run: |
          ruff check . > ruff_report.txt || true  # non-blocking until baseline addressed
      - name: Lint via Makefile (ensures make targets work)
        run: |
          make ci-lint || true
      - name: Type check (mypy - subset)
        run: |
          mypy src/core/correlation/hunt_correlation.py > mypy_report.txt || true
      - name: Typecheck via Makefile
        run: |
          make ci-typecheck || true
      - name: Security scan (bandit)
        run: |
          bandit -q -r src -f json -o bandit_report.json || true
      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=65 || true
      - name: Run tests via Makefile
        env:
          PYTHONPATH: ./src
        run: |
          make ci-test || true
      - name: Model pipeline smoke
        env:
          PYTHONPATH: ./src
        run: |
          make ci-model-smoke
      - name: Auth smoke (admin/API-key/JWT)
        env:
          PYTHONPATH: ./src
          ADMIN_UI_TOKEN: admin-secret-ci
          API_KEYS_JSON: '[{"key":"ci-key","scopes":["feedback.write","factors.search","models.promote","models.alias"]}]'
          JWT_TEST_SECRET: jwt-test-secret-ci
        run: |
          pytest -q tests/test_auth_smoke.py
      - name: Strict audit
        run: |
          python scripts/audit_runner.py --strict --output audit_results.json || true
          cat audit_results.json || true
      - name: Coverage badge (optional)
        run: |
          if [ -f coverage.xml ]; then python scripts/generate_coverage_badge.py --xml coverage.xml --out coverage-badge.svg || true; fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            coverage.xml
            coverage-badge.svg
            audit_results.json
            ruff_report.txt
            mypy_report.txt
            bandit_report.json

  async-tests:
    runs-on: ubuntu-latest
    needs: build-test-audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (runtime + pytest-asyncio)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest-asyncio
      - name: Run async-only tests
        env:
          PYTHONPATH: ./src
          TEST_PER_FILE_TIMEOUT_SEC: 50
        run: |
          python scripts/run_tests_async_only.py
      - name: Upload async artifacts (none if pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-test-logs
          path: |
            .

  supply-chain:
    runs-on: ubuntu-latest
    needs: build-test-audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom==3.14.2 gitleaks-bin==8.18.4 || true
      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py --format json --output sbom.json || true
      - name: Secret scan (gitleaks)
        run: |
          gitleaks detect --no-git -v --report-format json --report-path gitleaks-report.json || true
      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: |
            sbom.json
            gitleaks-report.json
