name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
          LLM_MOCK: '1'
          LLM_SUMMARIES_ENABLED: '1'
          LLM_ALLOW_LOCAL_DETERMINISTIC: '1'
          API_KEY: ci-test-key
          API_KEYS_JSON: '[{"key":"ci-test-key","scopes":["*"]}]'
          STRICT_API_KEY_ENFORCEMENT: '1'
          ENV: ci
          APP_ENV: ci
          ENABLE_CSV_UPLOAD: 'true'
        run: |
          pytest tests/ \
            --ignore=tests/playwright \
            --ignore=tests/fixtures \
            -x -q \
            --tb=short \
            --timeout=120
        timeout-minutes: 15

  e2e:
    name: E2E golden path (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server in background
        env:
          PYTHONPATH: .
          LLM_MOCK: '1'
          LLM_SUMMARIES_ENABLED: '1'
          API_KEY: ci-test-key
          API_KEYS_JSON: '[{"key":"ci-test-key","scopes":["*"]}]'
          STRICT_API_KEY_ENFORCEMENT: '1'
          ENV: ci
          APP_ENV: ci
          ENABLE_CSV_UPLOAD: 'true'
          ADAPTIVE_EWMA: '1'
        run: |
          python start_simple.py &
          echo $! > .server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null 2>&1 && echo "Server ready (${i}s)" && break
            sleep 2
          done

      - name: Run Playwright E2E golden path
        env:
          BASE_URL: http://localhost:8080
          JANUSEC_API_KEY: ci-test-key
        run: |
          npx playwright test \
            tests/playwright/breach_golden_path.spec.js \
            --reporter=list \
            --timeout=120000
        timeout-minutes: 10

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
