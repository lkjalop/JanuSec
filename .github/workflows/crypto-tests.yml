name: Crypto Tests

# Environment-specific suite; see docs/CI_SCOPE.md.
on:
  workflow_dispatch:

jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        deps: [minimal, full]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "full" ]; then
            pip install dkimpy dnspython pytest
          else
            pip install pytest
          fi
      - name: Run crypto tests
        env:
          FAST_TEST_MODE: '1'
        run: |
          if [ "${{ matrix.deps }}" = "full" ]; then
            pytest -q tests/test_arc_validation.py tests/test_arc_rfc_verification.py || true
          else
            pytest -q tests/test_admin_arc_config.py || true
          fi
