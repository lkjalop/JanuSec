name: Emission Coverage Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run emission coverage tests (no autoseed)
        env:
          EMISSION_COVERAGE_THRESHOLD: ${{ env.EMISSION_COVERAGE_THRESHOLD || '10' }}
          EMISSION_COVERAGE_AUTOSEED: '0'
        run: |
          python -m pytest -q tests/test_emission_coverage.py
