name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt || true
      - name: Wait for service (assumes staging exposes URL in $SERVICE_URL)
        run: |
          echo "Waiting for $SERVICE_URL..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" ${SERVICE_URL:-http://localhost:8080}/api/v1/health || true)
            if [ "$status" = "200" ]; then echo "Service healthy"; exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy"; exit 1
      - name: Run smoke checks
        env:
          SERVICE_URL: ${SERVICE_URL:-http://localhost:8080}
        run: |
          chmod +x ./scripts/smoke_checks.sh
          ./scripts/smoke_checks.sh $SERVICE_URL
