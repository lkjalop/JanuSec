name: Helm CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: |
          helm lint charts/janusec

      - name: Template chart (dev values)
        run: |
          helm template janusec charts/janusec -f charts/janusec/values.yaml > /tmp/janusec-render.yaml

