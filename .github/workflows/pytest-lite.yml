name: pytest-lite

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 3 * * 1' # weekly on Mondays at 03:00 UTC

jobs:
  pytest-lite:
    name: Run selected lite pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (lite)
        env:
          PLATFORM_LITE_INIT: '1'
        run: |
          python -m pytest -q tests/test_webhook_guard.py tests/test_zeek_adapter.py tests/test_dread_scorer.py tests/test_intel_sync.py tests/test_bgp_network_wiring.py tests/test_ebpf_smoke.py tests/test_identity_snapshot.py tests/test_bgp_metadata_edges.py

  pytest-full-schedule:
    name: Run full tests on schedule (weekly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run full test suite
        env:
          PLATFORM_LITE_INIT: '1'
        run: |
          python -m pytest -q
