name: CI - Full Tests With Supervisor

on:
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC

jobs:
  runs-with-supervisor:
    runs-on: ubuntu-latest
    env:
      ENABLE_SUPERVISOR: '1'
      TEMPFILE_SWEEP_INTERVAL_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run full test suite (may be slow)
        run: |
          python -m pytest -q
