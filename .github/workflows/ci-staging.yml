name: CI Staging

on: [push, pull_request]

jobs:
  unit-tests:
    name: Unit Tests (${ { matrix.db } })
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    env:
      FAST_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dry-run report-store migration
        run: python scripts/migrate_report_store.py --dry-run || true
      - name: Run unit tests (fast)
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            export DATABASE_URL="sqlite:///./data/test.sqlite";
          else
            export DATABASE_URL="postgresql://threat:threat@127.0.0.1:5432/threat";
          fi
          python -m pytest -q -k "not integration and not slow" --junitxml=unit-results.xml || true
      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        with:
          name: unit-results-${{ matrix.db }}
          path: unit-results.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: threat
          POSTGRES_USER: threat
          POSTGRES_PASSWORD: threat
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U threat -d threat"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql://threat:threat@127.0.0.1:5432/threat
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dry-run report-store migration
        run: python scripts/migrate_report_store.py --dry-run || true
      - name: Run integration tests
        run: |
          python -m pytest -q -k "integration or slow" --junitxml=integration-results.xml || true
      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-results
          path: integration-results.xml

