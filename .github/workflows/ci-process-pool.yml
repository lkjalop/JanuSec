name: CI - Process Pool Isolation

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  process-pool-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_pool: [true, false]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run focused process-pool test
        env:
          USE_PROCESS_POOL: ${{ matrix.use_pool }}
        run: |
          python - <<'PY'
import os
v = os.environ.get('USE_PROCESS_POOL','False').lower() in ('1','true','yes')
cfg_str = f"from types import SimpleNamespace\ncnf = SimpleNamespace(pipeline={{'use_process_pool': {v}, 'process_pool_timeout': 5}})\n"
          pytest -q tests/test_process_pool_isolation.py::test_heavy_sleep_runs_in_process -q
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-pool-test-logs
          path: |
            ./**/pytest-*.xml
