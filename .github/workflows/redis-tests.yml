name: Redis-backed tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  redis-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || true
          pip install redis pytest
      - name: Run Redis-backed cache tests
        env:
          REDIS_URL: redis://localhost:6379/0
          PLATFORM_LITE_INIT: '1'
        run: |
          python -m pytest tests/test_geo_cache_and_reputation.py -q -k cache -s
