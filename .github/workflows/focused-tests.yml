name: Focused tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -e . || true
          pip install pytest
      - name: Run focused pytest
        env:
          PYTEST_ADDOPTS: -q
        run: |
          python -m pytest tests/test_correlation_registry_sanity.py tests/test_correlation_rules_expanded.py tests/test_smoke_enrichment_and_label.py tests/test_sbom_endpoints.py
