name: CI - Supervisor Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  supervisor-matrix:
    runs-on: ubuntu-latest
    env:
      ENABLE_SUPERVISOR: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run focused supervisor tests
        run: |
          python -m pytest -q tests/test_worker_supervisor_backoff.py tests/test_process_pool_isolation.py -q
