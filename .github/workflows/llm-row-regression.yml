name: LLM Row Regression

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-llm-row:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show Python
        run: python --version
      - name: Create wheelhouse dir
        run: mkdir -p ./.wheels
      - name: Cache wheelhouse
        uses: actions/cache@v4
        with:
          path: ./.wheels
          key: ${{ runner.os }}-wheels-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml','**/setup.py','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-wheels-${{ matrix.python-version }}-
      - name: Build wheels (if missing)
        run: |
          if [ -z "$(ls -A ./.wheels 2>/dev/null)" ]; then
            python -m pip wheel --wheel-dir=./.wheels -r requirements.txt || true
            python -m pip wheel --wheel-dir=./.wheels -e . || true
          else
            echo "wheelhouse present, skipping build"
          fi
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies from wheelhouse
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ./.wheels -r requirements.txt || pip install -r requirements.txt
          python -m pip install --no-index --find-links ./.wheels -e . || pip install -e .
      - name: Cache pytest and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .venv
          key: ${{ runner.os }}-pytest-${{ matrix.python-version }}-${{ hashFiles('**/pytest.ini') }}
          restore-keys: |
            ${{ runner.os }}-pytest-${{ matrix.python-version }}-
      - name: Run focused tests
        run: |
          set -e
          python -m pytest -q tests/test_llm_row_handling_regression.py tests/test_augment_llm_row_unit.py -q

  deep-analyze:
    runs-on: ubuntu-latest
    needs: test-llm-row
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show Python
        run: python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -e . || true
      - name: Run deep_analyze tests
        run: |
          set -e
          python -m pytest -q tests/test_deep_analyze* -q

  windows-smoke:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (Windows)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -e . || true
      - name: Run Windows smoke tests
        run: |
          set -e
          python -m pytest -q tests/test_llm_row_handling_regression.py -q
