name: LLM Row Regression

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-llm-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -e . || true
      - name: Cache pytest and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .venv
          key: ${{ runner.os }}-pytest-${{ github.sha }}
      - name: Run focused pytest for LLM regression and unit tests
        run: |
          python -m pytest -q tests/test_llm_row_handling_regression.py tests/test_augment_llm_row_unit.py
