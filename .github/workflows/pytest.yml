name: Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Create venv
      run: python -m venv .venv && . .venv/bin/activate
    - name: Start test services if compose exists
      run: |
        if [ -f docker-compose.ci.yml ]; then
          docker-compose -f docker-compose.ci.yml up -d
          for i in {1..30}; do
            docker ps --filter "health=unhealthy" --format '{{.Names}}' | grep -q . && sleep 2 || break
            sleep 1
          done
        else
          echo "No docker-compose.ci.yml found, skipping"
        fi
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pytest pytest-asyncio || true
    - name: Run tests
      run: |
        . .venv/bin/activate
        pytest -q
    - name: Route allowlist gate
      env:
        ROUTE_ALLOWLIST_ENFORCE: '1'
      run: |
        . .venv/bin/activate
        python tools/route_allowlist_check.py
