name: CI Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.11]
        region: ["us-east-1", "us-west-2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install moto boto3 || true

      - name: Terraform Init/Plan (no backend)
        env:
          AWS_REGION: ${{ matrix.region }}
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate || true
          terraform plan -var="region=${{ matrix.region }}" -var="dlq_bucket_name=test-dlq-${{ matrix.region }}" -var="dlq_queue_name=test-queue-${{ matrix.region }}" || true

      - name: Run Python unit tests
        run: |
          python -m pytest -q tests/test_ebpf_correlation.py tests/test_falco_adapter.py
