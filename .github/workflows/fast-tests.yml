name: Fast Tests

on:
  push:
    paths:
      - 'tests/fast/**'
      - 'src/**'
      - '.github/workflows/fast-tests.yml'
  pull_request:
    paths:
      - 'tests/fast/**'
      - 'src/**'

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run fast tests
        run: |
          python -m pytest -q tests/fast
