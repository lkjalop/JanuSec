name: promtool-rules-check

on:
  push:
    paths:
      - 'monitoring/**/*.yml'
  pull_request:
    paths:
      - 'monitoring/**/*.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSL -o promtool.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar -xzf promtool.tar.gz
          echo "$(pwd)/prometheus-2.53.0.linux-amd64" >> $GITHUB_PATH
      - name: Validate alert rules
        run: |
          promtool check rules monitoring/alert_rules_guardrails.yml

