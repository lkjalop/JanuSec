name: PR Artifacts - Generate Demo Events

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, public-readme-update ]

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
      - name: Generate demo events
        run: |
          python tools/data-ingestion-simulator/generate_events.py --count 500 > demo_events.jsonl
      - name: Zip demo events
        run: zip demo_events.zip demo_events.jsonl
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-events
          path: demo_events.zip
      - name: Install PDF deps (ReportLab)
        run: |
          python -m pip install --upgrade pip
          pip install reportlab markdown || true
      - name: Build whitepaper PDF
        run: |
          python tools/convert_md_to_pdf.py whitepapers/technical_deep_dive.md whitepapers/technical_deep_dive.pdf || true
      - name: Upload whitepaper PDF
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: whitepapers/technical_deep_dive.pdf
