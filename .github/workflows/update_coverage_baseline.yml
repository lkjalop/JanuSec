name: Update Coverage Baseline

# Environment-specific suite; see docs/CI_SCOPE.md.
on:
  workflow_dispatch:

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Generate coverage matrices
        run: |
          python -m src.tools.coverage_generator --json coverage_report.json --md coverage_report.md
      - name: Compute & write baseline
        id: write
        run: |
          python scripts/update_coverage_baseline.py --approve
      - name: Maybe create Pull Request with updated baseline
        if: ${{ github.event.inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update coverage baseline'
          branch: 'auto/update-coverage-baseline'
          title: 'Update coverage baseline'
          body: |-
            This PR contains an updated coverage baseline generated by the automated workflow.
            Review the changes and merge if acceptable.
          labels: baseline,automation
