name: Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '*' ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd 'redis-cli ping' --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONUNBUFFERED: '1'
      PLATFORM_LITE_INIT: '0'
      TEST_HELPERS_ENABLED: '1'
      DISABLE_DB: '0'
      SESSION_PERSIST_DIR: data/sessions
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements.txt || true
      - name: Wait for services
        run: |
          for i in {1..30}; do
            nc -z localhost 6379 && nc -z localhost 5432 && break || sleep 2
          done
      - name: Run integration tests (light)
        run: |
          python -m pytest -q tests/test_resign_worker.py tests/test_cloud_kms_secrets.py tests/test_keystore_resolve.py -q
      - name: Run extended integration tests
        if: github.event_name == 'push'
        run: |
          python -m pytest -q tests/test_graph_sessions.py tests/test_hopgraph_integration.py -q
name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 2s --health-retries 10
    env:
      APP_DB_DSN: postgresql://test:test@localhost:5433/testdb
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install psycopg2-binary
      - name: Run migrations and integration tests
        run: |
          pwsh -File scripts/wait_and_migrate.ps1 -dsn $env:APP_DB_DSN
          pwsh -File scripts/run_tests_integration.ps1
        shell: bash
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: .pytest_cache || tests/reports || ''
