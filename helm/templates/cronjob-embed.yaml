apiVersion: batch/v1
kind: CronJob
metadata:
  name: janusec-embed-batch
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: embed-batch
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            command: ["python","-m","src.pipeline.embedding_worker"]
          restartPolicy: OnFailure
