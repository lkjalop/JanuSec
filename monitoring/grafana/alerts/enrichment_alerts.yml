groups:
  - name: enrichment-scheduler.rules
    rules:
      - alert: EnrichmentSchedulerRunErrorsHigh
        expr: increase(enrich_scheduler_run_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Enrichment scheduler is emitting run errors"
          description: "Errors detected in the enrichment scheduler in the last 5 minutes."

      - alert: EnrichmentSchedulerRateDropsHigh
        expr: increase(enrich_scheduler_rate_drops_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate drops detected in enrichment scheduler"
          description: "Rate drops exceeded threshold in the last 5 minutes."

      - alert: EnrichmentJobsMigratedStalled
        expr: rate(enrich_scheduler_jobs_migrated[10m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No enrichment jobs migrated recently"
          description: "No migration activity detected for enrichment jobs in the last 30 minutes."
