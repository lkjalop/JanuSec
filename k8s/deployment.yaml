apiVersion: v1
kind: Namespace
metadata:
  name: janusec
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: janusec
---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: janusec-config
  namespace: janusec
data:
  DEFAULT_FRONTEND: "console"
  APP_ENV: "production"
  ENV: "production"
  STRICT_API_KEY_ENFORCEMENT: "true"
  ALLOW_DEFAULT_TENANT: "0"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "janusec.pipeline-workers"
  KAFKA_INPUT_TOPIC: "janusec.normalized"
  KAFKA_OUTPUT_TOPIC: "janusec.decisions"
  REDIS_URL: "redis://redis.janusec.svc.cluster.local:6379/0"
  REDIS_INGEST_STREAM: "ingest_stream"
  LLM_PROVIDER: "ollama"
  OLLAMA_HOST: "http://ollama.janusec.svc.cluster.local:11434"
  HOPGRAPH_PERSISTENCE_ENABLED: "true"
  HOPGRAPH_EDGE_TTL_SECONDS: "604800"
  METRICS_DAILY_INTERVAL_SECONDS: "86400"
  TENANT_RATE_LIMIT_ENABLED: "true"
  THRESHOLD_JITTER_ENABLED: "true"
  DP_ENABLED: "true"
  DP_QUANTISE_BANDS: "20"
  DP_LAPLACE_EPSILON: "1.0"
---
# ── Secrets (values injected via Sealed Secrets / Vault / env substitution) ──
apiVersion: v1
kind: Secret
metadata:
  name: janusec-secrets
  namespace: janusec
type: Opaque
stringData:
  # Replace with actual secrets before applying — use external secrets operator
  # or kubectl create secret generic janusec-secrets --from-env-file=.env.production
  API_KEYS_JSON: '[{"key":"REPLACE_ME","scopes":["*"]}]'
  AUDIT_CHAIN_SECRET: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  DB_DSN: "postgresql+asyncpg://janusec:REPLACE_ME@postgres.janusec.svc.cluster.local/janusec"
  AZURE_CLIENT_SECRET: ""
  SENTINEL_CLIENT_SECRET: ""
  EB_WEBHOOK_TOKEN: "REPLACE_ME"
---
# ── App Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janusec-app
  namespace: janusec
  labels:
    app: janusec-app
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: janusec-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: janusec-app
    spec:
      serviceAccountName: janusec
      containers:
        - name: app
          image: janusec/platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: janusec-config
            - secretRef:
                name: janusec-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: janusec-data
---
apiVersion: v1
kind: Service
metadata:
  name: janusec-app
  namespace: janusec
spec:
  selector:
    app: janusec-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: janusec-app-hpa
  namespace: janusec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: janusec-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ── LLM Worker Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janusec-worker
  namespace: janusec
  labels:
    app: janusec-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: janusec-worker
  template:
    metadata:
      labels:
        app: janusec-worker
    spec:
      serviceAccountName: janusec
      containers:
        - name: worker
          image: janusec/platform:latest
          command: ["python", "-m", "src.workers.llm_worker"]
          envFrom:
            - configMapRef:
                name: janusec-config
            - secretRef:
                name: janusec-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
# ── Kafka Pipeline Worker Deployment ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janusec-kafka-worker
  namespace: janusec
  labels:
    app: janusec-kafka-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: janusec-kafka-worker
  template:
    metadata:
      labels:
        app: janusec-kafka-worker
    spec:
      serviceAccountName: janusec
      containers:
        - name: kafka-worker
          image: janusec/platform:latest
          command: ["python", "-m", "src.workers.kafka_pipeline_worker"]
          envFrom:
            - configMapRef:
                name: janusec-config
            - secretRef:
                name: janusec-secrets
          env:
            - name: KAFKA_WORKER_CONCURRENCY
              value: "8"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: janusec-kafka-worker-hpa
  namespace: janusec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: janusec-kafka-worker
  minReplicas: 2
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# ── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: janusec-ingress
  namespace: janusec
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - janusec.example.com
      secretName: janusec-tls
  rules:
    - host: janusec.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: janusec-app
                port:
                  number: 80
---
# ── Persistent Volume Claims ─────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: janusec-data
  namespace: janusec
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
# ── Service Account ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: janusec
  namespace: janusec
  annotations:
    # Uncomment for IRSA (AWS EKS):
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/JanuSecRole
    # Uncomment for Workload Identity (GKE):
    # iam.gke.io/gcp-service-account: janusec@PROJECT.iam.gserviceaccount.com
