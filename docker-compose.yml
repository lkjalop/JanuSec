version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: janusec  # legacy: threatsifter
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  app:
    build: .
    volumes:
      - ./data/assessments:/app/data/assessments
    environment:
      APP_DB_DSN: postgresql://postgres:postgres@db:5432/janusec  # set DB_NAME=threatsifter to reuse legacy schema
      API_KEYS_JSON: '[{"key":"devkey123","scopes":["nlp.query","factors.search","feedback.write"]}]'
      ACCESS_LOG_SAMPLE_RATE: 0.5
      DEFAULT_FRONTEND: console
      TEST_HELPERS_ENABLED: "1"
      SESSION_PERSIST_DIR: /app/data/assessments
      EVIDENCE_COVERAGE_TARGET: "0.7"
      EVIDENCE_COVERAGE_WARN: "0.5"
      EVIDENCE_COVERAGE_CRITICAL: "0.3"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
    depends_on:
      - db
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alert_rules.example.yaml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:
