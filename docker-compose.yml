services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-janusec}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-janusec}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    user: root
    volumes:
      - ./data/assessments:/app/data/assessments
      - sessiondata:/app/data/sessions
      - ./artifacts:/app/artifacts
    environment:
      ENV: "${ENV:-staging}"
      APP_ENV: "${APP_ENV:-staging}"
      APP_DB_DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-janusec}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      API_KEYS_JSON: "${API_KEYS_JSON:-[{\"key\":\"devkey123\",\"scopes\":[\"*\"]}]}"
      ACCESS_LOG_SAMPLE_RATE: "0.5"
      DEFAULT_FRONTEND: "${DEFAULT_FRONTEND:-breach}"
      DEFAULT_TENANT: "${DEFAULT_TENANT:-default}"
      API_KEY: "${API_KEY:-devkey123}"
      TEST_HELPERS_ENABLED: "0"
      PLATFORM_LITE_INIT: "0"
      FAST_TEST_MODE: "0"
      DISABLE_DB: "0"
      LOAD_FULL_ROUTES: "1"
      STRICT_API_KEY_ENFORCEMENT: "1"
      SESSION_PERSIST_DIR: "/app/data/sessions"
      GRAPH_SESSION_SNAPSHOT_DIR: "/app/data/sessions/graph_snapshots"
      HOPGRAPH_PERSISTENCE_ENABLED: "1"
      HOPGRAPH_DB_PATH: "/app/data/sessions/hopgraph.db"
      EVIDENCE_COVERAGE_TARGET: "0.7"
      EVIDENCE_COVERAGE_WARN: "0.5"
      EVIDENCE_COVERAGE_CRITICAL: "0.3"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen3:14b"
      LLM_PROVIDER: "ollama"
      LLM_STRICT_PROVIDER: "1"
      LLM_ALLOW_LOCAL_DETERMINISTIC: "0"
      OLLAMA_PREWARM_ON_STARTUP: "${OLLAMA_PREWARM_ON_STARTUP:-1}"
      ENABLE_JOB_WORKER: "${ENABLE_JOB_WORKER:-1}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s

  worker:
    build: .
    user: root
    command: ["python", "-m", "src.workers.llm_worker", "--redis", "redis://redis:6379/0"]
    environment:
      ENV: "${ENV:-staging}"
      APP_ENV: "${APP_ENV:-staging}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      APP_DB_DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-janusec}"
      API_KEY: "${API_KEY:-devkey123}"
      DEFAULT_TENANT: "${DEFAULT_TENANT:-default}"
      LOAD_FULL_ROUTES: "1"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_STRICT_PROVIDER: "1"
      LLM_ALLOW_LOCAL_DETERMINISTIC: "0"
      TEST_HELPERS_ENABLED: "0"
      PLATFORM_LITE_INIT: "0"
      FAST_TEST_MODE: "0"
      DISABLE_DB: "0"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen3:14b"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker-ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alert_rules.example.yaml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # CB-1: Local LLM inference - Ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Pull the default model after Ollama is healthy
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "curl -s -X POST http://ollama:11434/api/pull
      -H 'Content-Type: application/json'
      -d '{\"name\":\"llama3.2:3b\"}'
      && echo 'Model pull requested.'"
    restart: "no"

  # P2: Kafka core bus — Zookeeper + Kafka + Schema Registry + topic init + UI
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    profiles:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    profiles:
      - kafka

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    profiles:
      - kafka

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --create --if-not-exists --topic janusec.ingest.aws --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.ingest.azure --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.ingest.email --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.ingest.endpoint --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.normalized --bootstrap-server kafka:9092 --partitions 24 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.decisions --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.alerts --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.audit --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --config retention.ms=-1 &&
        kafka-topics --create --if-not-exists --topic janusec.dlq.ingest --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic janusec.dlq.pipeline --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
        echo 'All Kafka topics created.'
      "
    restart: "no"
    profiles:
      - kafka

  # Scale this service: docker compose --profile kafka up --scale kafka-pipeline-worker=4
  kafka-pipeline-worker:
    build: .
    command: python -m src.workers.kafka_pipeline_worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      KAFKA_CONSUMER_GROUP: janusec.pipeline-workers
      KAFKA_INPUT_TOPIC: janusec.normalized
      KAFKA_OUTPUT_TOPIC: janusec.decisions
      REDIS_URL: redis://redis:6379/0
    profiles:
      - kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: janusec-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - dev


volumes:
  pgdata:
  redisdata:
  grafana_data:
  sessiondata:
  ollama_data:
  kafka_data:
  zk_data:
  zk_logs:
