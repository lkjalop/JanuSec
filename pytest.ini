[pytest]
minversion = 6.0
addopts = -q --timeout=60 --maxfail=1
testpaths = tests
python_files = test_*.py
markers =
	benchmark: mark a test as a performance benchmark
	integration: mark a test as integration
	asyncio: mark async tests (pytest-asyncio)
asyncio_mode = auto
; plugins setting removed: pytest does not accept a global 'plugins' option
; If plugin loading is required, use `pytest_plugins` in `conftest.py` or
; install/enable plugins via command-line or environment. Kept intentionally
; blank to avoid PytestConfigWarning about unknown config option.
