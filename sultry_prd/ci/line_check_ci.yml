name: Sultry PRD CI

on: [push, pull_request]

jobs:
  check-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run line checker
        run: |
          python sultry_prd/scripts/check_max_lines.py
