version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: janusec
      POSTGRES_PASSWORD: janusec
      POSTGRES_DB: janusec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U janusec -d janusec"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
