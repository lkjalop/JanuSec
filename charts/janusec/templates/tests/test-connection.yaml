apiVersion: v1
kind: Pod
metadata:
  name: {{ include "janusec.fullname" . }}-test-connection
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.9.1
      args:
        - -sf
        - {{ ternary (printf "https://%s/api/v1/health" .Values.ingress.host) (printf "http://%s:%v/api/v1/health" (include "janusec.fullname" .) .Values.service.port) .Values.ingress.tls.enabled }}
