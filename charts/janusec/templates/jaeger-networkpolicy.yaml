{{- if and .Values.networkPolicy.enabled .Values.jaeger.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/component: allinone
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 16686
        - port: 4318
        - port: 4317
  egress:
    - {}
{{- end }}

