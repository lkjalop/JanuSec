{{- if .Values.oauth2Proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "janusec.fullname" . }}-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "janusec.fullname" . }}-oauth2-proxy
  template:
    metadata:
      labels:
        app: {{ include "janusec.fullname" . }}-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          args:
            - "--http-address=0.0.0.0:4180"
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: {{ .Values.oauth2Proxy.provider | quote }}
            - name: OAUTH2_PROXY_UPSTREAMS
              value: {{ printf "http://%s:%d" (include "janusec.fullname" .) (.Values.service.port | int) | quote }}
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: {{ join "," .Values.oauth2Proxy.emailDomains | quote }}
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: {{ .Values.oauth2Proxy.oidc.issuerURL | quote }}
            - name: OAUTH2_PROXY_CLIENT_ID
              value: {{ .Values.oauth2Proxy.oidc.clientID | quote }}
            - name: OAUTH2_PROXY_SCOPE
              value: {{ .Values.oauth2Proxy.oidc.scope | quote }}
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: {{ .Values.oauth2Proxy.redirectURL | quote }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "janusec.fullname" .)) .Values.oauth2Proxy.existingSecret | quote }}
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "janusec.fullname" .)) .Values.oauth2Proxy.existingSecret | quote }}
                  key: cookieSecret
          ports:
            - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "janusec.fullname" . }}-oauth2-proxy
spec:
  selector:
    app: {{ include "janusec.fullname" . }}-oauth2-proxy
  ports:
    - name: http
      port: {{ .Values.oauth2Proxy.servicePort }}
      targetPort: 4180
{{- end }}
